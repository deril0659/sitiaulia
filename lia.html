<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Private</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff0844,#ff5e62);
    overflow:hidden;
}

/* HEART BACKGROUND */
.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation:fall 6s linear infinite;
    opacity:0.6;
}

@keyframes fall{
    0%{transform:translateY(-10vh);}
    100%{transform:translateY(110vh);}
}

/* LOGIN CARD */
.container{
    width:360px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 0 40px rgba(255,0,90,0.7);
    text-align:center;
    color:white;
    z-index:2;
}

h2{
    margin-bottom:20px;
    font-weight:800;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:white;
    color:#ff0844;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ff0844;
    color:white;
}

.link{
    margin-top:15px;
    cursor:pointer;
    font-size:14px;
}

.hidden{
    display:none;
}

/* VALENTINE PAGE */
.valentine{
    position:absolute;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#ff0844,#ff5e62);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.valentine h1{
    font-size:45px;
    font-weight:800;
    margin-bottom:20px;
    text-shadow:0 0 20px white;
}

.love-btn{
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    background:white;
    color:#ff0844;
    cursor:pointer;
    margin-bottom:20px;
}

.logout{
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    color:#ff0844;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

/* GALLERY BOX */
.letter{
    width:320px;
    background:white;
    color:#ff0844;
    padding:20px;
    border-radius:15px;
    display:none;
    animation:fade 1s ease-in-out;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

img, video{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
    <h2>Login Valentine ❤️</h2>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="link" onclick="showRegister()">Belum punya akun? Register</div>
</div>

<!-- REGISTER -->
<div class="container hidden" id="registerBox">
    <h2>Register ❤️</h2>
    <input type="text" id="regUser" placeholder="Username">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="register()">Register</button>
    <div class="link" onclick="showLogin()">Sudah punya akun? Login</div>
</div>

<!-- VALENTINE PAGE -->
<div class="valentine hidden" id="valentinePage">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>Happy Valentine ❤️</h1>
    <button class="love-btn" onclick="showLetter()">Buka Gallery 💌</button>

    <div class="letter" id="letterBox">
        <h3>Gallery Special For You ❤️</h3>

        <button onclick="showImage()">📸 Tampilkan Gambar</button>
        <button onclick="showVideo()">🎥 Tampilkan Video</button>

        <!-- FOTO -->
        <div id="imageBox" style="display:none;">
            <img src="gambar2.jpeg">
            <button onclick="backToGallery()">⬅ Kembali</button>
        </div>

        <!-- VIDEO -->
        <div id="videoBox" style="display:none;">
            <video controls>
                <source src="lia.mp4" type="video/mp4">
            </video>
            <button onclick="backToGallery()">⬅ Kembali</button>
        </div>

    </div>
</div>

<script>
// HEART ANIMATION
for(let i=0;i<30;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"%";
    heart.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(heart);
}

// ELEMENTS
const loginBox = document.getElementById("loginBox");
const registerBox = document.getElementById("registerBox");
const valentinePage = document.getElementById("valentinePage");
const letterBox = document.getElementById("letterBox");

function showRegister(){
    loginBox.classList.add("hidden");
    registerBox.classList.remove("hidden");
}

function showLogin(){
    registerBox.classList.add("hidden");
    loginBox.classList.remove("hidden");
}

function register(){
    let user=document.getElementById("regUser").value;
    let pass=document.getElementById("regPass").value;

    if(user && pass){
        localStorage.setItem("valUser",user);
        localStorage.setItem("valPass",pass);
        alert("Akun berhasil dibuat!");
        showLogin();
    }else{
        alert("Isi semua data!");
    }
}

function login(){
    let user=document.getElementById("loginUser").value;
    let pass=document.getElementById("loginPass").value;
    let savedUser=localStorage.getItem("valUser");
    let savedPass=localStorage.getItem("valPass");

    if(user===savedUser && pass===savedPass){
        loginBox.classList.add("hidden");
        valentinePage.classList.remove("hidden");
    }else{
        alert("Username atau password salah!");
    }
}

function showLetter(){
    letterBox.style.display="block";
}

function showImage(){
    document.getElementById("imageBox").style.display="block";
    document.getElementById("videoBox").style.display="none";
}

function showVideo(){
    document.getElementById("videoBox").style.display="block";
    document.getElementById("imageBox").style.display="none";
}

function backToGallery(){
    document.getElementById("imageBox").style.display="none";
    document.getElementById("videoBox").style.display="none";
}

function logout(){
    valentinePage.classList.add("hidden");
    loginBox.classList.remove("hidden");
}
</script>

</body>
</html>
